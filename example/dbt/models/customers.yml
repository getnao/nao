version: 2

semantic_models:
  - name: customers
    description: One row per customer, with lifetime aggregates.
    model: ref('customers')
    defaults:
      agg_time_dimension: first_order
    entities:
      - name: customer
        type: primary
        expr: customer_id
    dimensions:
      - name: first_order
        type: time
        type_params:
          time_granularity: day
      - name: most_recent_order
        type: time
        type_params:
          time_granularity: day
      - name: first_name
        type: categorical
      - name: last_name
        type: categorical
    measures:
      - name: customer_count
        description: Number of customers.
        agg: count_distinct
        expr: customer_id
      - name: lifetime_value_total
        agg: sum
        expr: customer_lifetime_value

metrics:
  - name: customers
    label: Customers
    description: Number of distinct customers.
    type: simple
    type_params:
      measure: customer_count

  - name: total_lifetime_value
    label: Total lifetime value
    description: Sum of customer lifetime values.
    type: simple
    type_params:
      measure: lifetime_value_total
