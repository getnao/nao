name: Helm

on:
    pull_request:
        paths:
            - 'helm/**'
            - '.github/workflows/helm.yml'
    push:
        tags:
            - 'v*'

permissions:
    contents: read

env:
    HELM_VERSION: v3.17.3

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v4
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Add bitnami repo
              run: helm repo add bitnami https://charts.bitnami.com/bitnami

            - name: Build chart dependencies
              run: helm dependency build ./helm

            - name: Lint chart
              run: helm lint ./helm

            - name: Render templates
              run: |
                  helm template nao ./helm \
                    --namespace nao \
                    --set secrets.betterAuthSecret=ci-secret-at-least-20-chars \
                    --set postgresql.auth.password=nao \
                    --set postgresql.auth.postgresPassword=nao

    publish:
        name: Publish to GHCR
        needs: lint
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v4
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Read chart version and app tag
              id: version
              run: |
                  APP_VERSION=${GITHUB_REF#refs/tags/v}
                  CHART_VERSION=$(awk '/^version:/ { print $2; exit }' helm/Chart.yaml | tr -d "'\"")
                  echo "app=$APP_VERSION" >> "$GITHUB_OUTPUT"
                  echo "chart=$CHART_VERSION" >> "$GITHUB_OUTPUT"
                  echo "Publishing chart $CHART_VERSION (nao image $APP_VERSION)"

            - name: Set appVersion to the nao image tag
              run: |
                  sed -i.bak "s/^appVersion: .*/appVersion: '${{ steps.version.outputs.app }}'/" helm/Chart.yaml
                  grep -E '^(version|appVersion):' helm/Chart.yaml

            - name: Add bitnami repo
              run: helm repo add bitnami https://charts.bitnami.com/bitnami

            - name: Build chart dependencies
              run: helm dependency build ./helm

            - name: Package chart
              run: helm package ./helm --destination dist

            - name: Log in to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Push chart
              run: helm push dist/nao-${{ steps.version.outputs.chart }}.tgz oci://ghcr.io/${{ github.repository }}/charts

            - name: Upload chart artifact
              uses: actions/upload-artifact@v4
              with:
                  name: nao-${{ steps.version.outputs.chart }}
                  path: dist/nao-*.tgz
                  retention-days: 30
