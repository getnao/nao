name: Helm

on:
    pull_request:
        paths:
            - 'helm/**'
            - '.github/workflows/helm.yml'
    push:
        tags:
            # The chart releases on its own cadence, independent of nao's v* tags
            - 'helm-v*'
    workflow_dispatch:

permissions:
    contents: read

env:
    HELM_VERSION: v3.17.3

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v4
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Add bitnami repo
              run: helm repo add bitnami https://charts.bitnami.com/bitnami

            - name: Build chart dependencies
              run: helm dependency build ./helm

            - name: Lint chart
              run: helm lint ./helm

            - name: Render templates
              run: |
                  helm template nao ./helm \
                    --namespace nao \
                    --set secrets.betterAuthSecret=ci-secret-at-least-20-chars \
                    --set postgresql.auth.password=nao \
                    --set postgresql.auth.postgresPassword=nao

    publish:
        name: Publish to GHCR
        needs: lint
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/helm-v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v4
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Read chart version
              id: version
              run: |
                  read_field() { awk "/^$1:/ { print \$2; exit }" helm/Chart.yaml | tr -d "'\""; }
                  CHART_VERSION=$(read_field version)

                  case "$GITHUB_REF" in
                      refs/tags/helm-v*)
                          TAG_VERSION=${GITHUB_REF#refs/tags/helm-v}
                          if [ "$TAG_VERSION" != "$CHART_VERSION" ]; then
                              echo "::error::Tag helm-v${TAG_VERSION} does not match Chart.yaml version ${CHART_VERSION}"
                              exit 1
                          fi
                          ;;
                  esac

                  echo "chart=$CHART_VERSION" >> "$GITHUB_OUTPUT"
                  echo "Publishing chart $CHART_VERSION (nao image $(read_field appVersion))"

            - name: Log in to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Fail if the chart version is already published
              run: |
                  if helm show chart oci://ghcr.io/${{ github.repository }}/charts/nao \
                      --version ${{ steps.version.outputs.chart }} > /dev/null 2>&1; then
                      echo "::error::Chart version ${{ steps.version.outputs.chart }} already exists — bump version in helm/Chart.yaml"
                      exit 1
                  fi

            - name: Add bitnami repo
              run: helm repo add bitnami https://charts.bitnami.com/bitnami

            - name: Build chart dependencies
              run: helm dependency build ./helm

            - name: Package chart
              run: helm package ./helm --destination dist

            - name: Push chart
              run: helm push dist/nao-${{ steps.version.outputs.chart }}.tgz oci://ghcr.io/${{ github.repository }}/charts

            - name: Upload chart artifact
              uses: actions/upload-artifact@v4
              with:
                  name: nao-${{ steps.version.outputs.chart }}
                  path: dist/nao-*.tgz
                  retention-days: 30
