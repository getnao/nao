name: Sync model prices

on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Refresh prices from models.dev
              run: bun scripts/models-dev.sync.ts
              working-directory: apps/backend

            - name: Open a pull request with the new prices
              uses: peter-evans/create-pull-request@v7
              with:
                  branch: chore/sync-model-prices
                  commit-message: 'chore(backend): refresh model prices from models.dev'
                  title: 'chore(backend): refresh model prices from models.dev'
                  body: |
                      Weekly refresh of `apps/backend/src/data/model-prices.json` from https://models.dev/api.json.

                      Review the price changes before merging: they change the cost of chats, usage dashboards and budgets.
                  add-paths: apps/backend/src/data/model-prices.json
                  delete-branch: true
