name: PR Preview Deployment

on:
    pull_request_target:
        types: [opened, synchronize, reopened, closed]

permissions:
    contents: read
    id-token: write
    pull-requests: write

# Previews run on Cloud Run in the dedicated `nao-previews` GCP project, behind a
# global load balancer that maps `<service>.preview.getnao.io` to the Cloud Run
# service of the same name. GitHub Actions authenticates via Workload Identity
# Federation, so no long-lived GCP credentials are stored in the repository.
env:
    GCP_PROJECT_ID: nao-previews
    GCP_REGION: europe-west9
    GCP_WORKLOAD_IDENTITY_PROVIDER: projects/996255898595/locations/global/workloadIdentityPools/github/providers/github
    GCP_DEPLOYER_SERVICE_ACCOUNT: github-preview-deployer@nao-previews.iam.gserviceaccount.com
    GCP_RUNTIME_SERVICE_ACCOUNT: nao-preview-runtime@nao-previews.iam.gserviceaccount.com
    IMAGE: europe-west9-docker.pkg.dev/nao-previews/previews/nao
    PREVIEW_DOMAIN: preview.getnao.io

jobs:
    # Security gate: pull_request_target runs with repo secrets, and the deploy
    # job below checks out the PR head and builds its Dockerfile. Without this
    # gate, any fork PR could exfiltrate every secret mounted into the build or
    # the preview container (see PR #849). Only approved contributors and repo
    # collaborators are allowed to trigger a preview build.
    gate:
        name: Check approved contributor
        runs-on: ubuntu-latest
        outputs:
            approved: ${{ steps.check.outputs.approved }}
        steps:
            - name: Check if PR author is approved
              id: check
              uses: actions/github-script@v7
              with:
                  script: |
                      const APPROVED_FILE = '.github/APPROVED_CONTRIBUTORS';
                      const prAuthor = context.payload.pull_request.user.login;
                      const defaultBranch = context.payload.repository.default_branch;

                      function setApproved(value, reason) {
                          console.log(reason);
                          core.setOutput('approved', value ? 'true' : 'false');
                      }

                      if (prAuthor.endsWith('[bot]')) {
                          return setApproved(false, `Skipping bot author: ${prAuthor}`);
                      }

                      try {
                          const { data: permissionLevel } = await github.rest.repos.getCollaboratorPermissionLevel({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              username: prAuthor,
                          });
                          if (['admin', 'maintain', 'write'].includes(permissionLevel.permission)) {
                              return setApproved(true, `${prAuthor} is a collaborator with ${permissionLevel.permission} access`);
                          }
                      } catch {
                          // user is not a collaborator; fall through to allowlist
                      }

                      // Always read the allowlist from the default branch, never from the PR head.
                      const { data: fileContent } = await github.rest.repos.getContent({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          path: APPROVED_FILE,
                          ref: defaultBranch,
                      });
                      if (!('content' in fileContent) || typeof fileContent.content !== 'string') {
                          return setApproved(false, `Could not read ${APPROVED_FILE}`);
                      }
                      const content = Buffer.from(fileContent.content, 'base64').toString('utf8');

                      for (const rawLine of content.split('\n')) {
                          const line = rawLine.trim();
                          if (!line || line.startsWith('#')) continue;
                          const [username, capability] = line.split(/\s+/);
                          if (
                              username?.toLowerCase() === prAuthor.toLowerCase() &&
                              capability?.toLowerCase() === 'pr'
                          ) {
                              return setApproved(true, `${prAuthor} is approved for PRs via ${APPROVED_FILE}`);
                          }
                      }

                      return setApproved(false, `${prAuthor} is not approved; preview build skipped`);

    deploy:
        name: Deploy Preview
        needs: gate
        runs-on: ubuntu-latest
        if: github.event.action != 'closed' && needs.gate.outputs.approved == 'true'

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Get short SHA
              id: sha
              run: |
                  PR_SHA="${{ github.event.pull_request.head.sha }}"
                  echo "short_sha=${PR_SHA::7}" >> $GITHUB_OUTPUT

            - name: Set preview name
              id: preview
              run: |
                  SERVICE_NAME="pr-${{ github.event.pull_request.number }}"
                  echo "service=${SERVICE_NAME}" >> $GITHUB_OUTPUT
                  echo "url=https://${SERVICE_NAME}.${PREVIEW_DOMAIN}" >> $GITHUB_OUTPUT
                  echo "image=${IMAGE}:${SERVICE_NAME}-${{ steps.sha.outputs.short_sha }}" >> $GITHUB_OUTPUT

            - name: Authenticate to Google Cloud
              id: gcp-auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
                  token_format: access_token

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2

            - name: Log in to Artifact Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.GCP_REGION }}-docker.pkg.dev
                  username: oauth2accesstoken
                  password: ${{ steps.gcp-auth.outputs.access_token }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push preview image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:${{ steps.preview.outputs.service }}
                      ${{ steps.preview.outputs.image }}
                  cache-from: |
                      type=registry,ref=${{ env.IMAGE }}:cache
                      type=registry,ref=${{ env.IMAGE }}:${{ steps.preview.outputs.service }}
                  cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max,image-manifest=true,oci-mediatypes=true
                  build-args: |
                      APP_VERSION=${{ steps.preview.outputs.service }}
                      APP_COMMIT=${{ steps.sha.outputs.short_sha }}

            - name: Write preview environment
              run: |
                  cat > "$RUNNER_TEMP/preview-env.yaml" <<EOF
                  BETTER_AUTH_URL: "${{ steps.preview.outputs.url }}"
                  BETTER_AUTH_SECRET: "$(openssl rand -hex 32)"
                  SEED_ON_START: "true"
                  NAO_CONTEXT_SOURCE: "local"
                  NAO_DEFAULT_PROJECT_PATH: "/app/example"
                  GITHUB_CLIENT_ID: "${{ secrets.PREVIEW_GITHUB_CLIENT_ID }}"
                  GITHUB_CLIENT_SECRET: "${{ secrets.PREVIEW_GITHUB_CLIENT_SECRET }}"
                  GITHUB_SSO: "true"
                  GITHUB_ALLOWED_USERS: "${{ secrets.PREVIEW_GITHUB_ALLOWED_USERS }},${{ github.event.pull_request.user.login }}"
                  DEFAULT_USER_ROLE: "admin"
                  NOTION_API_KEY: "something-random"
                  OPENAI_API_KEY: "${{ secrets.PREVIEW_OPENAI_API_KEY }}"
                  POSTHOG_DISABLED: "true"
                  EOF

            - name: Deploy to Cloud Run
              run: |
                  gcloud run deploy "${{ steps.preview.outputs.service }}" \
                      --project "$GCP_PROJECT_ID" \
                      --region "$GCP_REGION" \
                      --platform managed \
                      --image "${{ steps.preview.outputs.image }}" \
                      --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
                      --port 5005 \
                      --cpu 2 \
                      --memory 2Gi \
                      --cpu-boost \
                      --no-cpu-throttling \
                      --execution-environment gen2 \
                      --min-instances 0 \
                      --max-instances 1 \
                      --concurrency 80 \
                      --timeout 3600 \
                      --allow-unauthenticated \
                      --ingress internal-and-cloud-load-balancing \
                      --labels "app=nao-preview,pr=${{ github.event.pull_request.number }},commit=${{ steps.sha.outputs.short_sha }}" \
                      --env-vars-file "$RUNNER_TEMP/preview-env.yaml" \
                      --quiet

                  echo "Preview deployed at ${{ steps.preview.outputs.url }}"

            - name: Comment on PR with preview URL
              uses: actions/github-script@v7
              with:
                  script: |
                      const previewUrl = '${{ steps.preview.outputs.url }}';
                      const sha = '${{ steps.sha.outputs.short_sha }}';

                      const body = `## 🚀 Preview Deployment

                      | | |
                      |---|---|
                      | **URL** | ${previewUrl} |
                      | **Commit** | \`${sha}\` |

                      > ⚠️ No LLM API keys configured - you'll see the API key setup flow when trying to chat.

                      ---
                      <sub>Runs on Cloud Run and scales to zero: the first request after idle takes a few seconds. Data is reset on every push. Preview will be automatically removed when this PR is closed.</sub>`;

                      // Find existing comment
                      const { data: comments } = await github.rest.issues.listComments({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                      });

                      const botComment = comments.find(comment =>
                          comment.user.type === 'Bot' &&
                          comment.body.includes('Preview Deployment')
                      );

                      if (botComment) {
                          await github.rest.issues.updateComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              comment_id: botComment.id,
                              body: body
                          });
                      } else {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              body: body
                          });
                      }

    cleanup:
        name: Cleanup Preview
        needs: gate
        runs-on: ubuntu-latest
        if: github.event.action == 'closed' && needs.gate.outputs.approved == 'true'

        steps:
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2

            - name: Remove preview deployment
              run: |
                  SERVICE_NAME="pr-${{ github.event.pull_request.number }}"
                  echo "Cleaning up preview ${SERVICE_NAME}..."

                  gcloud run services delete "$SERVICE_NAME" \
                      --project "$GCP_PROJECT_ID" \
                      --region "$GCP_REGION" \
                      --quiet 2>/dev/null || true

                  TAGS=$(gcloud artifacts docker tags list "$IMAGE" \
                      --project "$GCP_PROJECT_ID" \
                      --format="value(tag.basename())" 2>/dev/null \
                      | grep -E "^${SERVICE_NAME}(-|$)" || true)
                  for TAG in $TAGS; do
                      gcloud artifacts docker images delete "${IMAGE}:${TAG}" \
                          --project "$GCP_PROJECT_ID" \
                          --delete-tags --quiet 2>/dev/null || true
                  done

                  echo "Preview cleanup complete"

            - name: Comment on PR
              uses: actions/github-script@v7
              with:
                  script: |
                      const body = `## 🧹 Preview Removed

                      The preview deployment for this PR has been cleaned up.`;

                      // Find existing preview comment and update it
                      const { data: comments } = await github.rest.issues.listComments({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                      });

                      const botComment = comments.find(comment =>
                          comment.user.type === 'Bot' &&
                          comment.body.includes('Preview Deployment')
                      );

                      if (botComment) {
                          await github.rest.issues.updateComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              comment_id: botComment.id,
                              body: body
                          });
                      }
