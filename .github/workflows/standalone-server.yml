name: Standalone Server

on:
    push:
        branches: [main]
        paths:
            - 'apps/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/standalone-server.yml'
    pull_request:
        paths:
            - 'apps/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/standalone-server.yml'

permissions:
    contents: read

jobs:
    boot:
        name: Compile and boot nao-chat-server
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Setup Bun (same version as publish.yml)
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Use the pinned npm
              run: ./scripts/use-pinned-npm.sh

            - name: Install dependencies
              run: npm ci
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Compile the standalone server
              run: npm run build:standalone
              working-directory: apps/backend

            - name: Boot the standalone server
              run: ./nao-chat-server --help
              working-directory: apps/backend
