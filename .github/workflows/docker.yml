name: Docker Build & Deploy

on:
    push:
        branches:
            - main
            - '**docker'
            - '**cloud'
        tags:
            - 'v*'

permissions:
    contents: read
    packages: write

env:
    REGISTRY: docker.io
    IMAGE_NAME: getnao/nao
    CACHE_REGISTRY: ghcr.io
    CACHE_IMAGE: ${{ github.repository }}/build-cache
    CLOUD_CONTAINER_NAME: nao-cloud
    CLOUD_DOMAIN: app.getnao.io
    CLOUD_BLUE_PORT: 5050
    CLOUD_GREEN_PORT: 5051

jobs:
    build:
        name: Build ${{ matrix.platform }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-tags: true
                  fetch-depth: 0

            - name: Get short SHA
              id: sha
              run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

            - name: Get build date
              id: build_date
              run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

            - name: Get app version
              id: app_version
              run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

            - name: Compute nao-core CLI version
              id: cli_version
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                      VERSION="${GITHUB_REF#refs/tags/v}"
                  else
                      # For alpha builds, base = (highest stable vX.Y.Z tag) + 1 patch
                      LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
                      if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                          BASE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
                      else
                          BASE="0.0.1"
                      fi
                      VERSION="${BASE}+alpha.${GITHUB_SHA::7}"
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Computed nao-core CLI version: $VERSION"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Log in to GitHub Container Registry (for build cache)
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.CACHE_REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  push: true
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=registry,ref=${{ env.CACHE_REGISTRY }}/${{ env.CACHE_IMAGE }}:${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
                  cache-to: type=registry,ref=${{ env.CACHE_REGISTRY }}/${{ env.CACHE_IMAGE }}:${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }},mode=max
                  build-args: |
                      APP_VERSION=${{ steps.app_version.outputs.version }}
                      APP_COMMIT=${{ steps.sha.outputs.short_sha }}
                      APP_BUILD_DATE=${{ steps.build_date.outputs.value }}
                      NAO_CLI_VERSION=${{ steps.cli_version.outputs.version }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        name: Merge and Push Manifest
        runs-on: ubuntu-latest
        needs: build

        outputs:
            image-tag: ${{ steps.sha.outputs.short_sha }}

        steps:
            - uses: actions/checkout@v4

            - name: Get short SHA
              id: sha
              run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=false
                  tags: |
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc') }}
                      type=raw,value=alpha,enable=${{ github.ref == 'refs/heads/main' }}
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,prefix=

            - name: Create and push manifest
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

            - name: Update Docker Hub description
              uses: peter-evans/dockerhub-description@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
                  repository: ${{ env.IMAGE_NAME }}
                  readme-filepath: ./README-dockerhub.md

    deploy:
        name: Deploy to GCP instance
        runs-on: ubuntu-latest
        needs: merge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || endsWith(github.ref, 'docker'))
        # Every ref deploys to the same blue/green slots: overlapping runs would remove each other's container.
        concurrency:
            group: deploy-moon
            cancel-in-progress: false

        steps:
            - name: Deploy with remote ssh commands using ssh key
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: github-actions-demo
                  key: ${{ secrets.PRIVATE_KEY }}
                  script: |
                      set -e
                      APP=nao-chat
                      IMAGE=getnao/nao:${{ needs.merge.outputs.image-tag }}

                      # Blue listens on 5005 and green on 5006, Caddy routes to whichever is healthy.
                      # The legacy single container holds the blue port, so it is replaced by green.
                      if [ "$(docker inspect -f '{{.State.Running}}' "$APP-blue" 2>/dev/null)" = "true" ]; then
                        NEW="$APP-green"; NEW_PORT=5006; OLD="$APP-blue"
                      elif [ "$(docker inspect -f '{{.State.Running}}' "$APP-green" 2>/dev/null)" = "true" ]; then
                        NEW="$APP-blue"; NEW_PORT=5005; OLD="$APP-green"
                      else
                        NEW="$APP-green"; NEW_PORT=5006; OLD="$APP"
                      fi

                      docker pull "$IMAGE"
                      docker rm -f "$NEW" 2>/dev/null || true
                      docker volume create nao-chat-storage >/dev/null
                      docker run -p "127.0.0.1:$NEW_PORT:5005" \
                        --restart unless-stopped \
                        --stop-timeout 150 \
                        -v nao-chat-storage:/app/storage \
                        -e "NAO_STORAGE_LOCAL_PATH=/app/storage" \
                        -e "SHUTDOWN_DRAIN_DELAY_MS=10000" \
                        -e "BETTER_AUTH_URL=https://moon.getnao.io" \
                        -e "DB_SSL=true" \
                        -e "DB_URI=postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST }}:${{ secrets.POSTGRES_PORT }}/${{ secrets.POSTGRES_DB }}" \
                        -e "NAO_CONTEXT_SOURCE=git" \
                        -e "NAO_CONTEXT_GIT_URL=${{ secrets.NAO_CONTEXT_GIT_URL }}" \
                        -e "NAO_CONTEXT_GIT_TOKEN=${{ secrets.NAO_CONTEXT_GIT_TOKEN }}" \
                        -e "NAO_DEFAULT_PROJECT_PATH=/app/chat-analytics" \
                        -e GOOGLE_APPLICATION_CREDENTIALS_JSON='${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' \
                        -e "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
                        -e "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" \
                        -e "LANGFUSE_PUBLIC_KEY=${{ secrets.MOON_LANGFUSE_PUBLIC_KEY }}" \
                        -e "LANGFUSE_SECRET_KEY=${{ secrets.MOON_LANGFUSE_SECRET_KEY }}" \
                        -e "LANGFUSE_BASE_URL=${{ secrets.MOON_LANGFUSE_BASE_URL }}" \
                        -e "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" \
                        -e "ENABLE_USER_SIGNUP=false" \
                        -e "BETA_AUTOMATIONS_ENABLED=true" \
                        -e "BETA_CONTEXT_RECOMMENDATIONS_ENABLED=true" \
                        -e "BETA_STORY_FILTERS_ENABLED=true" \
                        -e "BETA_SUBAGENTS_ENABLED=true" \
                        -e "BETA_CUSTOM_STORIES_ENABLED=true" \
                        -e "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" \
                        -e "SMTP_HOST=${{ secrets.SMTP_HOST }}" \
                        -e "SMTP_PORT=${{ secrets.SMTP_PORT }}" \
                        -e "SMTP_MAIL_FROM=${{ secrets.SMTP_MAIL_FROM }}" \
                        -e "SMTP_USER=${{ secrets.SMTP_USER }}" \
                        -e "SMTP_SSL=${{ secrets.SMTP_SSL }}" \
                        -e "GITHUB_CLIENT_ID=${{ secrets.MOON_GITHUB_CLIENT_ID }}" \
                        -e "GITHUB_CLIENT_SECRET=${{ secrets.MOON_GITHUB_CLIENT_SECRET }}" \
                        --device /dev/kvm \
                        --name "$NEW" \
                        -d "$IMAGE"

                      HEALTHY=false
                      for _ in $(seq 1 90); do
                        if curl -fsS -o /dev/null "http://127.0.0.1:$NEW_PORT/api/health"; then
                          HEALTHY=true
                          break
                        fi
                        sleep 2
                      done
                      if [ "$HEALTHY" != "true" ]; then
                        echo "$NEW did not become healthy, keeping $OLD live"
                        docker logs --tail 50 "$NEW"
                        docker rm -f "$NEW"
                        exit 1
                      fi

                      echo "$NEW is healthy, draining $OLD"
                      docker stop -t 150 "$OLD" 2>/dev/null || true
                      docker rm "$OLD" 2>/dev/null || true
                      echo "Deployed $NEW at https://moon.getnao.io"

    deploy-cloud:
        name: Deploy Cloud
        runs-on: ubuntu-latest
        needs: merge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/cloud' || endsWith(github.ref, 'cloud'))
        concurrency:
            group: deploy-cloud
            cancel-in-progress: false

        steps:
            - name: Deploy to cloud server
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: github-actions-demo
                  key: ${{ secrets.PRIVATE_KEY }}
                  script: |
                      set -e
                      APP="${{ env.CLOUD_CONTAINER_NAME }}"
                      IMAGE=getnao/nao:${{ needs.merge.outputs.image-tag }}

                      # Blue and green share the projects and storage volumes, Caddy routes to whichever is healthy.
                      # The legacy single container holds the blue port, so it is replaced by green.
                      if [ "$(docker inspect -f '{{.State.Running}}' "$APP-blue" 2>/dev/null)" = "true" ]; then
                        NEW="$APP-green"; NEW_PORT=${{ env.CLOUD_GREEN_PORT }}; OLD="$APP-blue"
                      elif [ "$(docker inspect -f '{{.State.Running}}' "$APP-green" 2>/dev/null)" = "true" ]; then
                        NEW="$APP-blue"; NEW_PORT=${{ env.CLOUD_BLUE_PORT }}; OLD="$APP-green"
                      else
                        NEW="$APP-green"; NEW_PORT=${{ env.CLOUD_GREEN_PORT }}; OLD="$APP"
                      fi

                      docker pull "$IMAGE"
                      docker rm -f "$NEW" 2>/dev/null || true
                      docker volume create nao-app-preview-projects >/dev/null
                      docker volume create nao-cloud-storage >/dev/null
                      docker network create nao-internal 2>/dev/null || true
                      docker run -d \
                          --name "$NEW" \
                          --restart unless-stopped \
                          --stop-timeout 150 \
                          --network nao-internal \
                          --network-alias "$APP" \
                          -p "127.0.0.1:$NEW_PORT:5005" \
                          -v nao-app-preview-projects:/app/projects \
                          -v nao-cloud-storage:/app/storage \
                          -e "NAO_PROJECTS_DIR=/app/projects" \
                          -e "NAO_STORAGE_LOCAL_PATH=/app/storage" \
                          -e "SHUTDOWN_DRAIN_DELAY_MS=10000" \
                          -e "BETTER_AUTH_URL=https://${{ env.CLOUD_DOMAIN }}" \
                          -e "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" \
                          -e "NAO_BACKOFFICE_API_KEY=${{ secrets.NAO_BACKOFFICE_API_KEY }}" \
                          -e "DB_SSL=true" \
                          -e "DB_URI=postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST }}:${{ secrets.POSTGRES_PORT }}/app" \
                          -e "NAO_MODE=cloud" \
                          -e "GITHUB_CLIENT_ID=${{ secrets.CLOUD_GITHUB_CLIENT_ID }}" \
                          -e "GITHUB_CLIENT_SECRET=${{ secrets.CLOUD_GITHUB_CLIENT_SECRET }}" \
                          -e "LANGFUSE_PUBLIC_KEY=${{ secrets.CLOUD_LANGFUSE_PUBLIC_KEY }}" \
                          -e "LANGFUSE_SECRET_KEY=${{ secrets.CLOUD_LANGFUSE_SECRET_KEY }}" \
                          -e "LANGFUSE_BASE_URL=${{ secrets.CLOUD_LANGFUSE_BASE_URL }}" \
                          -e "GITHUB_SSO=true" \
                          -e "POSTHOG_DISABLED=true" \
                          -e "NAO_CONTEXT_SOURCE=api" \
                          -e "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" \
                          -e "SMTP_HOST=${{ secrets.SMTP_HOST }}" \
                          -e "SMTP_PORT=${{ secrets.SMTP_PORT }}" \
                          -e "SMTP_USER=${{ secrets.SMTP_USER }}" \
                          -e "SMTP_MAIL_FROM=${{ secrets.SMTP_MAIL_FROM }}" \
                          -e "SMTP_SSL=${{ secrets.SMTP_SSL }}" \
                          -e "ENABLE_USER_LOGIN=true" \
                          -e "ENABLE_USER_SIGNUP=true" \
                          -e "BETA_AUTOMATIONS_ENABLED=true" \
                          -e "BETA_CONTEXT_RECOMMENDATIONS_ENABLED=true" \
                          -e "BETA_STORY_FILTERS_ENABLED=true" \
                          -e "BETA_CUSTOM_STORIES_ENABLED=true" \
                          -e "CLOUD_BILLING_ENABLED=true" \
                          -e "STRIPE_SECRET_KEY=${{ secrets.NAOCLOUD_STRIPE_SECRET_KEY }}" \
                          -e "STRIPE_WEBHOOK_SECRET=${{ secrets.NAOCLOUD_STRIPE_WEBHOOK_SECRET }}" \
                          -e "STRIPE_CLOUD_PRODUCT_ID=${{ secrets.NAOCLOUD_STRIPE_CLOUD_PRODUCT_ID }}" \
                          -e "STRIPE_CLOUD_MONTHLY_PRICE_LOOKUP_KEY=${{ secrets.NAOCLOUD_STRIPE_CLOUD_MONTHLY_PRICE_LOOKUP_KEY }}" \
                          -e "GOOGLE_CLIENT_ID=${{ secrets.NAOCLOUD_GOOGLE_CLIENT_ID }}" \
                          -e "GOOGLE_CLIENT_SECRET=${{ secrets.NAOCLOUD_GOOGLE_CLIENT_SECRET }}" \
                          -e "CLOUD_GITHUB_PROJECT_ORG=${{ secrets.NAOCLOUD_GITHUB_PROJECT_ORG }}" \
                          -e "CLOUD_GITHUB_PROJECT_APP_ID=${{ secrets.NAOCLOUD_GITHUB_PROJECT_APP_ID }}" \
                          -e "CLOUD_GITHUB_PROJECT_INSTALLATION_ID=${{ secrets.NAOCLOUD_GITHUB_PROJECT_INSTALLATION_ID }}" \
                          -e "CLOUD_GITHUB_PROJECT_PRIVATE_KEY=${{ secrets.NAOCLOUD_GITHUB_PROJECT_PRIVATE_KEY }}" \
                          "$IMAGE"

                      HEALTHY=false
                      for _ in $(seq 1 90); do
                        if curl -fsS -o /dev/null "http://127.0.0.1:$NEW_PORT/api/health"; then
                          HEALTHY=true
                          break
                        fi
                        sleep 2
                      done
                      if [ "$HEALTHY" != "true" ]; then
                        echo "$NEW did not become healthy, keeping $OLD live"
                        docker logs --tail 50 "$NEW"
                        docker rm -f "$NEW"
                        exit 1
                      fi

                      echo "$NEW is healthy, draining $OLD"
                      docker stop -t 150 "$OLD" 2>/dev/null || true
                      docker rm "$OLD" 2>/dev/null || true
                      echo "Deployed $NEW at https://${{ env.CLOUD_DOMAIN }}"
