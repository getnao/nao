name: Publish to PyPI

on:
    push:
        tags:
            - 'v*'

permissions: {}

jobs:
    # The frontend bundle is the same on every platform, so it is built once instead of in each wheel job
    frontend:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: '1.3.11'
                  no-cache: true

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
              with:
                  node-version-file: '.nvmrc'

            - name: Install npm dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build frontend
              working-directory: apps/frontend
              run: npx vite build
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            - name: Upload frontend artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: frontend-dist
                  path: apps/frontend/dist
                  if-no-files-found: error
                  retention-days: 7

    build:
        needs: [frontend]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-15
                      platform: darwin
                      arch: arm64
                      wheel-tag: macosx_15_0_arm64
                    - os: macos-15-intel
                      platform: darwin
                      arch: x64
                      wheel-tag: macosx_15_0_x86_64
                    - os: ubuntu-latest
                      platform: linux
                      arch: x64
                      wheel-tag: manylinux2014_x86_64
                    - os: ubuntu-24.04-arm
                      platform: linux
                      arch: arm64
                      wheel-tag: manylinux2014_aarch64
                    - os: windows-latest
                      platform: win
                      arch: x64
                      wheel-tag: win_amd64

        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
            id-token: write # Sign the SLSA build provenance
            attestations: write
        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Get version from tag
              id: version
              run: |
                  # Extract version from tag (v0.0.35 -> 0.0.35)
                  VERSION=${GITHUB_REF#refs/tags/v}
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Building version: $VERSION"

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: '1.3.11'
                  no-cache: true

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
              with:
                  node-version-file: '.nvmrc'

            - name: Use the pinned npm
              run: ./scripts/use-pinned-npm.sh

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: '3.12'

            - name: Setup uv
              uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
              with:
                  enable-cache: false

            - name: Install Python build dependencies
              run: uv pip install --system cyclopts

            # The cache sits next to the checkout because Bun can only hard-link packages within one drive,
            # and on Windows runners the home folder is on C: while the checkout is on D:
            - name: Install npm dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache

            - name: Download frontend artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: frontend-dist
                  path: ${{ runner.temp }}/frontend-dist

            - name: Update version in package files
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  # Update pyproject.toml
                  sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" cli/pyproject.toml

                  # Update __init__.py
                  sed -i.bak "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" cli/nao_core/__init__.py

                  echo "Updated version to $VERSION"
                  grep "^version" cli/pyproject.toml
                  grep "__version__" cli/nao_core/__init__.py

            - name: Mark as production build
              run: echo 'BUILD_MODE = "prod"' > cli/nao_core/_build_info.py

            - name: Build server and package
              working-directory: cli
              run: python build.py --force --frontend-dist "$FRONTEND_DIST"
              env:
                  FRONTEND_DIST: ${{ runner.temp }}/frontend-dist
                  PYTHONUTF8: '1'

            - name: Boot the bundled server
              working-directory: cli/nao_core/bin
              run: ./nao-chat-server${{ matrix.platform == 'win' && '.exe' || '' }} --help

            - name: Rename wheel with platform tag
              working-directory: cli/dist
              run: |
                  for f in *.whl; do
                    # Replace -any.whl with platform-specific tag
                    newname="${f%-py3-none-any.whl}-py3-none-${{ matrix.wheel-tag }}.whl"
                    echo "Renaming $f -> $newname"
                    mv "$f" "$newname"
                  done
                  ls -la

            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: cli/dist/*.whl

            - name: Upload wheel artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: wheel-${{ matrix.wheel-tag }}
                  path: cli/dist/*.whl
                  retention-days: 7

