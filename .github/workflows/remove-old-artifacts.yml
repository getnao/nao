name: Nightly cleanup

on:
    schedule:
        # Every day at 1am
        - cron: '0 1 * * *'
    workflow_dispatch:

jobs:
    remove-old-artifacts:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            actions: write

        steps:
            - name: Remove old artifacts
              uses: c-hive/gha-remove-artifacts@v1
              with:
                  age: '5 days'

    cleanup-pr-previews:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            pull-requests: read
            id-token: write

        env:
            GCP_PROJECT_ID: nao-previews
            GCP_REGION: europe-west9

        steps:
            - name: Get open PR numbers
              id: open-prs
              uses: actions/github-script@v7
              with:
                  script: |
                      const prs = await github.paginate(github.rest.pulls.list, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          state: 'open',
                      });
                      const numbers = prs.map(pr => pr.number);
                      core.setOutput('numbers', numbers.join(','));
                      console.log(`Open PRs: ${numbers.join(', ') || 'none'}`);

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: projects/996255898595/locations/global/workloadIdentityPools/github/providers/github
                  service_account: github-preview-deployer@nao-previews.iam.gserviceaccount.com

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2

            - name: Cleanup stale preview deployments
              run: |
                  OPEN_PRS="${{ steps.open-prs.outputs.numbers }}"

                  SERVICES=$(gcloud run services list \
                      --project "$GCP_PROJECT_ID" \
                      --region "$GCP_REGION" \
                      --filter="metadata.labels.app=nao-preview" \
                      --format="value(metadata.name)")

                  if [ -z "$SERVICES" ]; then
                      echo "No preview services found"
                      exit 0
                  fi

                  CLEANED=0
                  for SERVICE in $SERVICES; do
                      PR_NUMBER="${SERVICE#pr-}"

                      if echo ",$OPEN_PRS," | grep -q ",$PR_NUMBER,"; then
                          echo "PR #${PR_NUMBER} is still open — keeping preview"
                          continue
                      fi

                      echo "PR #${PR_NUMBER} is merged or closed — deleting ${SERVICE}..."
                      gcloud run services delete "$SERVICE" \
                          --project "$GCP_PROJECT_ID" \
                          --region "$GCP_REGION" \
                          --quiet || true

                      CLEANED=$((CLEANED + 1))
                  done

                  echo "Cleaned up $CLEANED stale preview(s)"

    cleanup-docker-images:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Remove all Docker images on VM
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: github-actions-demo
                  key: ${{ secrets.PRIVATE_KEY }}
                  script: docker rmi -f $(docker images -aq) 2>/dev/null || true
