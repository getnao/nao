name: CLI Windows PDF export

on:
    workflow_run:
        workflows: [Publish to PyPI]
        types: [completed]
    workflow_dispatch:
        inputs:
            version:
                description: 'nao-core version to test (defaults to the newest on PyPI, pre-releases included)'
                required: false
    push:
        paths:
            - '.github/workflows/cli-windows-pdf.yml'
            - 'scripts/story-pdf-smoke.py'

permissions:
    contents: read

jobs:
    story-pdf:
        name: Story PDF export (${{ matrix.browser }})
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        runs-on: windows-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - browser: chrome
                      executable: ''
                    - browser: edge
                      executable: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Resolve the nao-core version
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.version }}
                  RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
              run: |
                  version="${INPUT_VERSION:-${RELEASE_TAG#v}}"
                  if [ -z "$version" ]; then
                    version=$(pip index versions nao-core --pre 2>/dev/null | head -1 | sed -E 's/.*\((.*)\).*/\1/')
                  fi
                  echo "Testing nao-core $version"
                  echo "value=$version" >> "$GITHUB_OUTPUT"

            - name: Install nao-core
              env:
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  for attempt in 1 2 3 4 5 6; do
                    pip install "nao-core==$VERSION" && exit 0
                    echo "PyPI does not serve $VERSION yet, retrying in 30s"
                    sleep 30
                  done
                  exit 1

            - name: Start nao chat and export a story as PDF
              env:
                  MCP_ENDPOINT_ENABLED: 'true'
                  BROWSER: 'none'
                  PYTHONUTF8: '1'
                  PUPPETEER_EXECUTABLE_PATH: ${{ matrix.executable }}
              run: |
                  mkdir smoke-project && cd smoke-project
                  echo 'project_name: pdf-smoke' > nao_config.yaml
                  nao chat > ../chat.log 2>&1 &
                  python -I ../scripts/story-pdf-smoke.py ../story.pdf

            - name: Upload the PDF and server log
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: story-pdf-${{ matrix.browser }}
                  path: |
                      story.pdf
                      chat.log
                  if-no-files-found: ignore
