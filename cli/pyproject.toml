[project]
name = "nao-core"
version = "0.1.9"
description = "nao Core is your analytics context builder with the best chat interface."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "nao Labs" }]
keywords = ["analytics", "chat", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cyclopts>=4.4.4",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "rich>=14.0.0",
    "ibis-framework>=9.0.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "cryptography>=46.0.3",
    "dotenv>=0.9.9",
    "python-dotenv>=1.2.1",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "questionary>=2.1.0",
    # Loose floor on purpose: tracking.py degrades to no-op telemetry when the
    # resolver lands on an old posthog (dbt toolchains commonly pin posthog<3,
    # e.g. elementary-data), instead of making nao-core uninstallable there.
    "posthog>=2.0.0",
    "pyngrok>=7.0.0",
    "python-dateutil>=2.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "sqlglot>=26.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Database backends
postgres = ["ibis-framework[postgres]>=9.0.0"]
bigquery = ["ibis-framework[bigquery]>=9.0.0", "google-cloud>=0.34.0"]
snowflake = ["ibis-framework[snowflake]>=9.0.0", "snowflake-connector-python[secure-local-storage]>=4.2.0"]
duckdb = ["ibis-framework[duckdb]>=9.0.0"]
clickhouse = ["ibis-framework[clickhouse]>=9.0.0", "clickhouse-driver>=0.2.9"]
databricks = ["ibis-framework[databricks]>=9.0.0", "certifi>=2024.0.0"]
mysql = ["ibis-framework[mysql]>=9.0.0"]
mssql = ["ibis-framework[mssql]>=9.0.0"]
athena = ["ibis-framework[athena]>=9.0.0"]
trino = ["ibis-framework[trino]>=9.0.0"]
redshift = ["ibis-framework[postgres]>=9.0.0", "sshtunnel>=0.4.0", "redshift-connector>=2.1.13"]
fabric = ["ibis-framework[mssql]>=9.0.0", "azure-identity>=1.19.0"]
starrocks = ["mysql-connector-python==9.5.0"]

# LLM providers
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.76.0"]
mistral = ["mistralai>=1.11.1,<2.0.0"]
gemini = ["google-genai>=1.61.0"]
ollama = ["ollama>=0.4.0"]

# Integrations
# Pinned below their next major: nao calls Views endpoints absent from notion-client and
# depends on notion2md's marker for unconvertible databases. 3.1 is the floor because it
# retries rate limits itself, which also covers the client notion2md builds internally.
notion = ["notion-client>=3.1.0,<4", "notion2md>=2.9.0,<3"]
# Confluence talks to the v1 REST API over httpx (a core dependency); markdownify turns the HTML
# body Confluence renders into the markdown the context layer stores.
confluence = ["markdownify>=0.13.0,<2"]

# Secret resolution backends
aws-secrets = ["boto3>=1.34.0", "glom>=23.0.0"]
k8s-secrets = ["kubernetes>=29.0.0"]

# Convenience groups
all-databases = [
    "nao-core[postgres,bigquery,snowflake,duckdb,clickhouse,databricks,mysql,mssql,athena,trino,redshift,fabric,starrocks]",
]
all-llms = ["nao-core[openai,anthropic,mistral,gemini,ollama]"]
all = ["nao-core[all-databases,all-llms,notion,confluence,aws-secrets,k8s-secrets]"]
dev = ["pytest>=9.0.2", "pytest-cov", "pytest-timeout>=2.3.0"]

[project.scripts]
nao = "nao_core.main:main"

[project.urls]
Homepage = "https://getnao.io"
Repository = "https://github.com/naolabs/chat"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.8.0", "ty>=0.0.9", "nao-core[all]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Include the bin directory with server binary and public assets
artifacts = ["nao_core/bin/**"]

[tool.hatch.build.targets.wheel]
packages = ["nao_core"]
exclude = ["**/example/**"]

[tool.hatch.build.targets.sdist]
include = [
    "nao_core/**",
    "README.md",
    "LICENSE",
]
exclude = ["**/example/**"]

[tool.uv]
exclude-newer = "2 days"

[tool.uv.pip]
exclude-newer = "2 days"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "timeout: mark test with a timeout in seconds (pytest-timeout).",
]
