apiVersion: v2
name: nao
description: Helm chart for nao — an open-source agent to do analytics on your data with AI.
type: application
version: 0.1.1
appVersion: '0.3.5'
icon: https://raw.githubusercontent.com/getnao/nao/main/apps/frontend/public/appicon.png

keywords:
  - analytics
  - ai
  - sql
  - text-to-sql
  - agent

home: https://github.com/getnao/nao
sources:
  - https://github.com/getnao/nao

maintainers:
  - name: Maxime FOURNIOUX
    url: https://github.com/mfournioux/nao
  - name: Christophe Blefari
    url: https://github.com/Bl3f

kubeVersion: ">=1.24.0"

dependencies:
  - name: postgresql
    version: "16.7.14"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
