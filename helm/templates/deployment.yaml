apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nao.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nao.labels" . | nindent 4 }}
  {{- with (include "nao.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nao.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nao.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nao.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and (eq .Values.config.contextSource "local") .Values.persistence.enabled .Values.config.gitSync.url }}
      initContainers:
        - name: git-sync
          image: {{ .Values.config.gitSync.image | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -n "${GIT_TOKEN:-}" ]; then
                AUTH_URL=$(echo "${GIT_URL}" | sed "s#https://#https://oauth2:${GIT_TOKEN}@#")
              else
                AUTH_URL="${GIT_URL}"
              fi
              if [ -d "{{ .Values.config.contextPath }}/.git" ]; then
                echo "Existing checkout found, pulling latest..."
                cd "{{ .Values.config.contextPath }}"
                git remote set-url origin "${AUTH_URL}"
                git fetch --depth 1 origin "${GIT_BRANCH}"
                git reset --hard "origin/${GIT_BRANCH}"
              else
                echo "No checkout found, cloning..."
                rm -rf "{{ .Values.config.contextPath }}"/*
                git clone --depth 1 --branch "${GIT_BRANCH}" "${AUTH_URL}" "{{ .Values.config.contextPath }}"
              fi
          env:
            - name: GIT_BRANCH
              value: {{ .Values.config.gitSync.branch | quote }}
            - name: GIT_URL
              value: {{ .Values.config.gitSync.url | quote }}
            {{- if .Values.secrets.contextGitToken }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nao.fullname" . }}
                  key: NAO_CONTEXT_GIT_TOKEN
            {{- end }}
          volumeMounts:
            - name: context
              mountPath: {{ .Values.config.contextPath }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "nao.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.serverPort | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "nao.fullname" . }}
            - secretRef:
                name: {{ include "nao.fullname" . }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if and (eq .Values.config.contextSource "local") .Values.persistence.enabled }}
            - name: context
              mountPath: {{ .Values.config.contextPath }}
            {{- end }}
            {{- if and (eq .Values.config.contextSource "api") .Values.projectsPersistence.enabled }}
            - name: projects
              mountPath: /app/projects
            {{- end }}
      volumes:
        {{- if and (eq .Values.config.contextSource "local") .Values.persistence.enabled }}
        - name: context
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-context" (include "nao.fullname" .)) }}
        {{- end }}
        {{- if and (eq .Values.config.contextSource "api") .Values.projectsPersistence.enabled }}
        - name: projects
          persistentVolumeClaim:
            claimName: {{ .Values.projectsPersistence.existingClaim | default (printf "%s-projects" (include "nao.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}