apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nao.fullname" . }}-test-connection"
  labels:
    {{- include "nao.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command:
        - curl
        - --fail
        - --silent
        - --max-time
        - "10"
        - "http://{{ include "nao.fullname" . }}:{{ .Values.service.port }}"
