{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nao.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nao.labels" . | nindent 4 }}
  {{- with (include "nao.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | quote }}
  DB_URI: {{ include "nao.dbUri" . | quote }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mistralApiKey }}
  MISTRAL_API_KEY: {{ .Values.secrets.mistralApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureApiKey }}
  AZURE_API_KEY: {{ .Values.secrets.azureApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureResourceName }}
  AZURE_RESOURCE_NAME: {{ .Values.secrets.azureResourceName | quote }}
  {{- end }}
  {{- if .Values.secrets.azureOpenaiBaseUrl }}
  AZURE_OPENAI_BASE_URL: {{ .Values.secrets.azureOpenaiBaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.azureApiVersion }}
  AZURE_API_VERSION: {{ .Values.secrets.azureApiVersion | quote }}
  {{- end }}
  {{- if .Values.secrets.awsBearerTokenBedrock }}
  AWS_BEARER_TOKEN_BEDROCK: {{ .Values.secrets.awsBearerTokenBedrock | quote }}
  {{- end }}
  {{- if .Values.secrets.awsRegion }}
  AWS_REGION: {{ .Values.secrets.awsRegion | quote }}
  {{- end }}
  {{- if .Values.secrets.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  {{- end }}
  {{- if .Values.secrets.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.contextGitToken }}
  NAO_CONTEXT_GIT_TOKEN: {{ .Values.secrets.contextGitToken | quote }}
  {{- end }}
  {{- if .Values.secrets.naoLicense }}
  NAO_LICENSE: {{ .Values.secrets.naoLicense | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpHost }}
  SMTP_HOST: {{ .Values.secrets.smtpHost | quote }}
  SMTP_PORT: {{ .Values.secrets.smtpPort | quote }}
  SMTP_SSL: {{ .Values.secrets.smtpSsl | quote }}
  SMTP_MAIL_FROM: {{ .Values.secrets.smtpMailFrom | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- if .Values.secrets.smtpUser }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.googleAuthDomains }}
  GOOGLE_AUTH_DOMAINS: {{ .Values.secrets.googleAuthDomains | quote }}
  {{- end }}
  {{- if .Values.secrets.githubClientId }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAllowedUsers }}
  GITHUB_ALLOWED_USERS: {{ .Values.secrets.githubAllowedUsers | quote }}
  {{- end }}
  {{- if .Values.secrets.gitlabClientId }}
  GITLAB_CLIENT_ID: {{ .Values.secrets.gitlabClientId | quote }}
  GITLAB_CLIENT_SECRET: {{ .Values.secrets.gitlabClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.gitlabAllowedUsers }}
  GITLAB_ALLOWED_USERS: {{ .Values.secrets.gitlabAllowedUsers | quote }}
  {{- end }}
  {{- if .Values.secrets.azureAdClientId }}
  AZURE_AD_CLIENT_ID: {{ .Values.secrets.azureAdClientId | quote }}
  AZURE_AD_CLIENT_SECRET: {{ .Values.secrets.azureAdClientSecret | quote }}
  AZURE_AD_TENANT_ID: {{ .Values.secrets.azureAdTenantId | quote }}
  {{- end }}
  {{- if .Values.secrets.azureAdTokenScope }}
  AZURE_AD_TOKEN_SCOPE: {{ .Values.secrets.azureAdTokenScope | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientId }}
  OIDC_CLIENT_ID: {{ .Values.secrets.oidcClientId | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  OIDC_DISCOVERY_URL: {{ .Values.secrets.oidcDiscoveryUrl | quote }}
  {{- if .Values.secrets.oidcProviderId }}
  OIDC_PROVIDER_ID: {{ .Values.secrets.oidcProviderId | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcProviderName }}
  OIDC_PROVIDER_NAME: {{ .Values.secrets.oidcProviderName | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcScopes }}
  OIDC_SCOPES: {{ .Values.secrets.oidcScopes | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcAuthDomains }}
  OIDC_AUTH_DOMAINS: {{ .Values.secrets.oidcAuthDomains | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcPkce }}
  OIDC_PKCE: {{ .Values.secrets.oidcPkce | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.notionApiKey }}
  NOTION_API_KEY: {{ .Values.secrets.notionApiKey | quote }}
  {{- end }}
{{- end }}