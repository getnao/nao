services:
    ducklake-catalog:
        image: postgres:16-alpine
        container_name: nao-ducklake-catalog
        environment:
            POSTGRES_USER: ducklake
            POSTGRES_PASSWORD: ducklake
            POSTGRES_DB: ducklake_catalog
        ports:
            - '5455:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ducklake -d ducklake_catalog']
            interval: 2s
            timeout: 3s
            retries: 30

    ducklake-storage:
        image: chrislusf/seaweedfs:4.48
        container_name: nao-ducklake-storage
        command: mini -dir=/data -bucket=ducklake
        environment:
            AWS_ACCESS_KEY_ID: naoducklake
            AWS_SECRET_ACCESS_KEY: naoducklake
        ports:
            - '9010:8333'
            - '9011:23646'
        healthcheck:
            test: ['CMD-SHELL', 'echo s3.bucket.list | weed shell 2>/dev/null | grep -qw ducklake']
            interval: 2s
            timeout: 5s
            retries: 30
