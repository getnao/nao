services:
    ducklake-catalog:
        image: postgres:16-alpine
        container_name: nao-ducklake-catalog
        environment:
            POSTGRES_USER: ducklake
            POSTGRES_PASSWORD: ducklake
            POSTGRES_DB: ducklake_catalog
        ports:
            - '5455:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ducklake -d ducklake_catalog']
            interval: 2s
            timeout: 3s
            retries: 30

    ducklake-storage:
        image: minio/minio:latest
        container_name: nao-ducklake-storage
        command: server /data --console-address ":9011"
        environment:
            MINIO_ROOT_USER: naoducklake
            MINIO_ROOT_PASSWORD: naoducklake
        ports:
            - '9010:9000'
            - '9011:9011'
        healthcheck:
            test: ['CMD-SHELL', 'mc ready local || exit 1']
            interval: 2s
            timeout: 3s
            retries: 30

    ducklake-storage-init:
        image: minio/mc:latest
        depends_on:
            ducklake-storage:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://ducklake-storage:9000 naoducklake naoducklake &&
            mc mb --ignore-existing local/ducklake &&
            echo 'bucket ready'
            "
